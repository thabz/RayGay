name: Tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  make-check:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake clang g++ gcc libjpeg-dev libpng-dev libtool make pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config

      - name: Generate build system
        run: ./autogen.sh

      - name: Build
        run: make

      - name: Run tests
        run: make check

      - name: Print test logs on failure
        if: failure()
        run: |
          find . -name '*.log' -print -exec sh -c 'echo "===== $1 ====="; cat "$1"' sh {} \;
